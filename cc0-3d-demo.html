<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九州武侠 · 第三方3D模型测试</title><meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate"><meta http-equiv="pragma" content="no-cache"><style>html,body{margin:0;background:#080b0e;color:#eef2f4;font-family:system-ui,"Microsoft YaHei"}main{max-width:1000px;margin:auto;padding:14px}.box{aspect-ratio:16/9;position:relative;background:#142028;border-radius:14px;overflow:hidden}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:12px 16px auto;z-index:2;display:flex;justify-content:space-between}.loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#091016dd;z-index:3;padding:20px}.hide{display:none}.note{margin-top:12px;padding:12px;background:#121a20;border-left:3px solid #8697a1;line-height:1.6}h1{font-family:KaiTi,serif;margin:0 0 8px}button{margin-top:10px;padding:8px 14px}.ok{color:#9dd89d}.err{color:#ffaaa0}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script></head><body><main><h1>九州武侠 · 第三方真模型测试</h1><div class="box" id="box"><canvas id="c"></canvas><div class="hud"><b>浪人 Jin</b><b>甲胄武士</b></div><div class="loading" id="loading"><div><b>正在加载第三方 CC0 3D 模型…</b><br><span id="msg">正在走 Git LFS 实体文件通道</span></div></div></div><button id="replay">重播</button><div class="note"><b>这页没有任何我自己画的人物。</b> 左右角色直接加载第三方 CC0 的 ronin / samurai GLTF 模型和它们自带的骨骼动画。上一版失败是因为请求到了 GitHub LFS 的普通 raw 路径；这一版改为 <code>media.githubusercontent.com</code> 的 LFS 实体文件地址。</div><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';THREE.Cache.enabled=false;const box=document.querySelector('#box'),canvas=document.querySelector('#c'),loading=document.querySelector('#loading'),msg=document.querySelector('#msg');const scene=new THREE.Scene();scene.background=new THREE.Color(0x19262d);scene.fog=new THREE.Fog(0x19262d,8,18);const camera=new THREE.PerspectiveCamera(38,16/9,.1,100);camera.position.set(0,3.1,9.5);camera.lookAt(0,1.4,0);const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;scene.add(new THREE.HemisphereLight(0xc9ddff,0x30291f,2.4));const d=new THREE.DirectionalLight(0xffddb0,3);d.position.set(-3,7,4);scene.add(d);const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,12),new THREE.MeshStandardMaterial({color:0x30342f,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);const loader=new GLTFLoader();loader.setCrossOrigin('anonymous');const root='https://media.githubusercontent.com/media/proofofplay/piratenation-art/main/Voxel%20Game%20Assets/Pirate%20Skins/';const defs=[['skin_ronin_jin/skin_ronin_jin.gltf',-2.4,Math.PI/2],['samurai/skin_samurai.gltf',2.4,-Math.PI/2]];let fighters=[],start=performance.now();function load(url){return new Promise((res,rej)=>loader.load(url,res,undefined,rej))}function fit(o){o.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(o),s=new THREE.Vector3();b.getSize(s);o.scale.setScalar(3/Math.max(.001,s.y));o.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(o);o.position.y-=b.min.y}function clip(cs,words){for(const w of words){const c=cs.find(x=>x.name.toLowerCase().includes(w));if(c)return c}return cs[0]}function play(f,key){if(f.key===key)return;f.key=key;const c=f.clips[key]||f.clips.idle;if(!c)return;const a=f.mixer.clipAction(c);a.reset();a.setLoop(key==='idle'||key==='run'?THREE.LoopRepeat:THREE.LoopOnce,key==='idle'||key==='run'?Infinity:1);a.clampWhenFinished=true;if(f.action)f.action.fadeOut(.12);a.fadeIn(.12).play();f.action=a}try{const gs=await Promise.all(defs.map(d=>load(root+d[0])));fighters=gs.map((g,i)=>{const h=new THREE.Group();h.position.x=defs[i][1];h.rotation.y=defs[i][2];scene.add(h);fit(g.scene);h.add(g.scene);const m=new THREE.AnimationMixer(g.scene),cs=g.animations||[];const f={h,m,key:'',action:null,clips:{idle:clip(cs,['idle']),run:clip(cs,['run']),attack:clip(cs,['attack','slash','melee']),hit:clip(cs,['hit','hurt','damage'])}};play(f,'idle');return f});msg.className='ok';msg.textContent=`加载成功：浪人 ${gs[0].animations.length} 段动画，武士 ${gs[1].animations.length} 段动画`;setTimeout(()=>loading.classList.add('hide'),900)}catch(e){console.error(e);msg.className='err';msg.textContent='模型仍加载失败：'+(e?.message||e)+'。这不是浏览器缓存，而是当前网络访问第三方模型源失败。';}function resize(){const r=box.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;fighters.forEach(f=>f.m.update(dt));if(fighters.length===2){const p=((now-start)/1000)%7;let x0=-2.4,x1=2.4;if(p<1.5){play(fighters[0],'idle');play(fighters[1],'idle')}else if(p<2.4){x0=-2.4+(p-1.5)/.9*1.8;play(fighters[0],'run')}else if(p<3.2){x0=-.6;play(fighters[0],'attack');play(fighters[1],'hit')}else if(p<4.2){play(fighters[0],'idle');play(fighters[1],'idle')}else if(p<5.1){x1=2.4-(p-4.2)/.9*1.8;play(fighters[1],'run')}else if(p<5.9){x1=.6;play(fighters[1],'attack');play(fighters[0],'hit')}else{play(fighters[0],'idle');play(fighters[1],'idle')}fighters[0].h.position.x=x0;fighters[1].h.position.x=x1}renderer.render(scene,camera)}requestAnimationFrame(loop);document.querySelector('#replay').onclick=()=>start=performance.now();</script></main></body></html>
