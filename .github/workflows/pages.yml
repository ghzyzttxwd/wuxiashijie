name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-actions
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Public HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          base='${{ steps.deployment.outputs.page_url }}'
          test -n "$base"
          html="$(curl -fsSL --retry 10 --retry-delay 2 --retry-all-errors "$base")"
          grep -q '九州武侠' <<<"$html"
          app="$(curl -fsSL --retry 10 --retry-delay 2 --retry-all-errors "${base%/}/src/app.js")"
          grep -q 'init' <<<"$app"
          curl -fsSL --retry 10 --retry-delay 2 --retry-all-errors "${base%/}/styles/main.css" >/dev/null
