name: duel-smoke
on:
  push:
    branches: [feature/duel-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playable-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser test tools
        run: npm install --prefix /tmp/duel-test-tools playwright@1.51.1
      - name: Check desktop, touch controls and offline reload
        env:
          NODE_PATH: /tmp/duel-test-tools/node_modules
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/duel-server.log 2>&1 &
          node duel/test/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duel-browser-evidence
          path: |
            /tmp/duel-*.png
            /tmp/duel-qa.json
            /tmp/duel-server.log
