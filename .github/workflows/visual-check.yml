name: visual-check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chinese fonts
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Locate browser
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Start local static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/jiuzhou-http.log 2>&1 &
          echo $! > /tmp/jiuzhou-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/jiuzhou-http.log
          exit 1
      - name: Capture creation UI
        shell: bash
        run: |
          mkdir -p artifacts
          '${{ steps.browser.outputs.path }}' --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=900 --screenshot=artifacts/creation.png http://127.0.0.1:4173/
          test -s artifacts/creation.png
      - name: Verify mobile world dashboard has no horizontal overflow
        shell: bash
        run: |
          '${{ steps.browser.outputs.path }}' --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=1200 --dump-dom http://127.0.0.1:4173/tools/visual-world.html > artifacts/world-mobile-dom.html
          grep -q 'data-visual-ready="world"' artifacts/world-mobile-dom.html
          grep -q 'data-no-horizontal-overflow="true"' artifacts/world-mobile-dom.html
      - name: Capture mobile world dashboard
        shell: bash
        run: |
          '${{ steps.browser.outputs.path }}' --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=1200 --screenshot=artifacts/world-mobile.png http://127.0.0.1:4173/tools/visual-world.html
          test -s artifacts/world-mobile.png
      - name: Verify deterministic production impact state
        shell: bash
        run: |
          '${{ steps.browser.outputs.path }}' --headless=new --no-sandbox --disable-gpu --virtual-time-budget=1500 --dump-dom 'http://127.0.0.1:4173/tools/visual-combat.html?freeze=impact' > artifacts/combat-dom.html
          grep -q 'data-visual-ready="impact"' artifacts/combat-dom.html
      - name: Capture deterministic combat impact frame
        shell: bash
        run: |
          '${{ steps.browser.outputs.path }}' --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --virtual-time-budget=1500 --screenshot=artifacts/combat.png 'http://127.0.0.1:4173/tools/visual-combat.html?freeze=impact'
          test -s artifacts/combat.png
      - name: Upload visual regression screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: artifacts/*.png
          if-no-files-found: error
