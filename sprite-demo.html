<style>

*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#27323d 0,#111820 42%,#080a0d 78%);display:flex;justify-content:center}
main{width:min(1120px,100%);padding:16px 10px 28px}.head{display:flex;align-items:end;justify-content:space-between;gap:12px;max-width:1040px;margin:0 auto 10px}.head h1{margin:0;font:800 clamp(20px,4vw,31px) "STKaiti","KaiTi","Noto Serif CJK SC",serif;letter-spacing:.05em}.head p{margin:4px 0 0;color:#aeb8c2;font-size:13px}.pill{white-space:nowrap;border:1px solid #c7d0da32;border-radius:999px;padding:6px 10px;background:#151c24b8;color:#e5ebf0;font-size:12px}

<div class="note"><strong>这版不是像素图。</strong> 人物改成可无限放大的矢量国风原型，先验证《金庸群侠传2》这类“卡通武侠人物 + 夸张招式表现”的方向。正式接入时，战斗逻辑、伤害数值和原有时间轴都不用推倒，只替换渲染层。<br><span class="good">下一步可以继续换成真正的高分辨率逐帧人物 / 骨骼动画素材。</span></div>
<script>
const $=s=>document.querySelector(s);const scene=$('#scene'),left=$('#left'),right=$('#right'),leftArm=$('#leftArm'),rightArm=$('#rightArm'),leftSword=$('#leftSword'),rightBlade=$('#rightBlade'),arc=$('#slashArc'),arc2=$('#slashArc2'),impact=$('#impact'),sparks=$('#sparks'),skill=$('#skillName'),hpR=$('#hpR');let start=performance.now(),paused=false,pauseAt=0,raf=0;const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));const ease=t=>1-Math.pow(1-clamp(t),3);const inout=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;function setT(el,x,y,r=0,s=1){el.setAttribute('transform',`translate(${x} ${y}) rotate(${r}) scale(${s})`)}function reset(){start=performance.now();hpR.setAttribute('width','349');skill.setAttribute('opacity','0');arc.setAttribute('opacity','0');arc2.setAttribute('opacity','0');impact.setAttribute('opacity','0');sparks.setAttribute('opacity','0');scene.style.transform='';}
function frame(now){if(paused){raf=requestAnimationFrame(frame);return}let t=(now-start)%7000;let lx=245,ly=418,rx=755,ry=418,lr=0,rr=0,armL=0,armR=0,bladeL=-18,bladeR=202;const breathe=Math.sin(t/190)*1.6;ly+=breathe;ry-=breathe*.7;if(t>900&&t<2400){const p=ease((t-900)/1500);lx=245+310*p;ly-=12*Math.sin(Math.PI*p);lr=5*Math.sin(Math.PI*p);}if(t>=2400&&t<3200){const p=clamp((t-2400)/800);lx=555+22*Math.sin(Math.PI*p);armL=-65*ease(p);bladeL=-18-98*ease(p);lr=10*Math.sin(Math.PI*p);skill.setAttribute('opacity',String(Math.sin(Math.PI*p)*.95));const a=clamp((p-.15)/.55);arc.setAttribute('opacity',String(Math.sin(Math.PI*a)*.95));arc2.setAttribute('opacity',String(Math.sin(Math.PI*a)*.8));arc.setAttribute('stroke-width',String(8+10*Math.sin(Math.PI*a)));if(p>.48&&p<.82){const q=(p-.48)/.34;impact.setAttribute('opacity',String(Math.sin(Math.PI*q)));sparks.setAttribute('opacity',String(Math.sin(Math.PI*q)));rx=755+76*ease(q);rr=18*Math.sin(Math.PI*q);hpR.setAttribute('width',String(349-(130*ease(q))));scene.style.transform=`translate(${(Math.random()-.5)*7}px,${(Math.random()-.5)*5}px) scale(1.008)`;}else scene.style.transform='';}if(t>=3200&&t<4450){const p=inout((t-3200)/1250);lx=577-332*p;rx=831-76*p;lr=-4*(1-p);rr=10*(1-p);skill.setAttribute('opacity','0');arc.setAttribute('opacity','0');arc2.setAttribute('opacity','0');impact.setAttribute('opacity','0');sparks.setAttribute('opacity','0');scene.style.transform='';}if(t>=4450&&t<5700){const p=ease((t-4450)/1250);rx=755-300*p;ry-=8*Math.sin(Math.PI*p);rr=-5*Math.sin(Math.PI*p);}if(t>=5700&&t<6450){const p=clamp((t-5700)/750);rx=455-18*Math.sin(Math.PI*p);armR=65*ease(p);bladeR=202+95*ease(p);rr=-9*Math.sin(Math.PI*p);if(p>.5){const q=clamp((p-.5)/.32);lx=245-55*ease(q);lr=-15*Math.sin(Math.PI*q);scene.style.transform=`translate(${(Math.random()-.5)*5}px,${(Math.random()-.5)*4}px)`;}}if(t>=6450){scene.style.transform='';}setT(left,lx,ly,lr);setT(right,rx,ry,rr);leftArm.setAttribute('transform',`rotate(${armL} 30 -68)`);rightArm.setAttribute('transform',`rotate(${armR} 30 -68)`);leftSword.setAttribute('transform',`translate(63 -28) rotate(${bladeL})`);rightBlade.setAttribute('transform',`translate(64 -28) rotate(${bladeR})`);raf=requestAnimationFrame(frame);}$('#replay').onclick=reset;$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'继续':'暂停';if(!paused){start+=performance.now()-pauseAt}else pauseAt=performance.now()};reset();raf=requestAnimationFrame(frame);
</script>
